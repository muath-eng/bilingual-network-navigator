name: CI

on:
  push:
    branches:
      - main
      - network-master-development
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Run lint
        run: bun run lint
      - name: Build production app
        run: bun run build
