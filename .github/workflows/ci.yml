name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Format, test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Prettier on exam route
        run: bunx prettier --write src/routes/exam.tsx
      - name: Commit Prettier formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/exam.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format exam route with Prettier"
            git push
          fi
      - name: Format files changed in this update
        run: >-
          bunx prettier --check
          src/lib/ccna-course.ts
          src/lib/content.ts
          src/lib/lesson-types.ts
          src/lib/lab-engine.ts
          src/lib/lab-engine.test.ts
          src/routes/lab.tsx
          src/routes/learn.index.tsx
          'src/routes/learn.$id.tsx'
          src/routes/mikrotik.tsx
          src/routes/practice.tsx
          src/routes/exam.tsx
          src/routes/profile.tsx
          src/routes/troubleshoot.tsx
          src/routes/about.tsx
          src/components/SiteHeader.tsx
      - name: Run tests
        run: bun run test
      - name: Lint updated files
        run: >-
          bunx eslint
          src/lib/ccna-course.ts
          src/lib/content.ts
          src/lib/lesson-types.ts
          src/lib/lab-engine.ts
          src/lib/lab-engine.test.ts
          src/routes/lab.tsx
          src/routes/learn.index.tsx
          'src/routes/learn.$id.tsx'
          src/routes/mikrotik.tsx
          src/routes/practice.tsx
          src/routes/exam.tsx
          src/routes/profile.tsx
          src/routes/troubleshoot.tsx
          src/routes/about.tsx
          src/components/SiteHeader.tsx
      - name: Build production app
        run: bun run build
