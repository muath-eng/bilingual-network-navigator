name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Format, test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format files changed in this update
        run: >-
          bunx prettier --write
          src/lib/ccna-course.ts
          src/lib/content.ts
          src/lib/lesson-types.ts
          src/lib/lab-engine.ts
          src/lib/lab-engine.test.ts
          src/routes/lab.tsx
          src/routes/learn.index.tsx
          'src/routes/learn.$id.tsx'
      - name: Commit formatting changes
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/ccna-course.ts src/lib/content.ts src/lib/lesson-types.ts src/lib/lab-engine.ts src/lib/lab-engine.test.ts src/routes/lab.tsx src/routes/learn.index.tsx 'src/routes/learn.$id.tsx'
            git commit -m "Format CCNA curriculum and lab updates"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Run tests
        run: bun run test
      - name: Lint updated files
        run: >-
          bunx eslint
          src/lib/ccna-course.ts
          src/lib/content.ts
          src/lib/lesson-types.ts
          src/lib/lab-engine.ts
          src/lib/lab-engine.test.ts
          src/routes/lab.tsx
          src/routes/learn.index.tsx
          'src/routes/learn.$id.tsx'
      - name: Build production app
        run: bun run build
